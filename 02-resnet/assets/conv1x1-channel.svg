<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker><marker id="g" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a7f37"/></marker></defs>
<rect x="0" y="0" width="760" height="330" fill="#ffffff" stroke="#d0d7de"/>
<text x="380" y="28" text-anchor="middle" font-size="16" fill="#111" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">1x1 합성곱: 한 픽셀 위치에서 채널 방향으로 내적한다</text>
<rect x="60" y="70" width="120" height="120" fill="#eaf2ff" stroke="#2f6feb" opacity="0.9"/>
<rect x="69" y="79" width="120" height="120" fill="#eaf2ff" stroke="#2f6feb" opacity="0.9"/>
<rect x="78" y="88" width="120" height="120" fill="#eaf2ff" stroke="#2f6feb" opacity="0.9"/>
<rect x="87" y="97" width="120" height="120" fill="#eaf2ff" stroke="#2f6feb" opacity="0.9"/>
<rect x="96" y="106" width="120" height="120" fill="#eaf2ff" stroke="#2f6feb" opacity="0.9"/>
<rect x="105" y="115" width="120" height="120" fill="#eaf2ff" stroke="#2f6feb" opacity="0.9"/>
<text x="150" y="250" text-anchor="middle" font-size="13" fill="#111" font-family="-apple-system,Helvetica,Arial,sans-serif">입력 H x W x 256</text>
<text x="150" y="268" text-anchor="middle" font-size="11.5" fill="#555" font-family="-apple-system,Helvetica,Arial,sans-serif">(그림은 6장만 그림)</text>
<line x1="80" y1="92" x2="130" y2="142" stroke="#cf222e" stroke-width="4"/>
<text x="64" y="84" text-anchor="start" font-size="12" fill="#cf222e" font-family="-apple-system,Helvetica,Arial,sans-serif">한 위치의 256개 값</text>
<line x1="250" y1="150" x2="330" y2="150" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="335" y="110" width="150" height="80" rx="6" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="410.0" y="155.0" text-anchor="middle" font-size="13" fill="#111" font-family="-apple-system,Helvetica,Arial,sans-serif">필터 1개 =</text>
<text x="410" y="172" text-anchor="middle" font-size="12.5" fill="#111" font-family="-apple-system,Helvetica,Arial,sans-serif">가중치 256개 + bias</text>
<text x="410" y="212" text-anchor="middle" font-size="12.5" fill="#111" font-family="-apple-system,Helvetica,Arial,sans-serif">y = w1 x1 + ... + w256 x256</text>
<text x="410" y="232" text-anchor="middle" font-size="12.5" fill="#1a7f37" font-weight="bold" font-family="-apple-system,Helvetica,Arial,sans-serif">필터가 64개면 출력 채널 64개</text>
<line x1="490" y1="150" x2="570" y2="150" stroke="#333" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="590" y="82" width="120" height="120" fill="#dafbe1" stroke="#1a7f37" opacity="0.9"/>
<rect x="599" y="91" width="120" height="120" fill="#dafbe1" stroke="#1a7f37" opacity="0.9"/>
<rect x="608" y="100" width="120" height="120" fill="#dafbe1" stroke="#1a7f37" opacity="0.9"/>
<text x="665" y="250" text-anchor="middle" font-size="13" fill="#111" font-family="-apple-system,Helvetica,Arial,sans-serif">출력 H x W x 64</text>
<text x="665" y="268" text-anchor="middle" font-size="11.5" fill="#555" font-family="-apple-system,Helvetica,Arial,sans-serif">(가로세로는 그대로)</text>
<text x="380" y="308" text-anchor="middle" font-size="13" fill="#555" font-family="-apple-system,Helvetica,Arial,sans-serif">출력 채널 수는 입력이 아니라 '필터를 몇 개 두었는가'로 정해진다</text>
</svg>