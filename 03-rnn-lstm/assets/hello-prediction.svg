<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/></marker>
</defs>
<rect width="880" height="360" fill="#fbfbf8" stroke="#ddd"/>
<text x="440" y="28" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">글자 단위 RNN 이 "hello" 를 배울 때: 입력은 h, e, l, l 이고 정답은 e, l, l, o</text><rect x="120" y="150" width="100" height="50" rx="8" fill="#e8f0fe" stroke="#3b5b9d" stroke-width="1.5"/><text x="170.0" y="173.0" text-anchor="middle" font-size="14" fill="#1a1a1a">h_1</text><text x="170.0" y="192.0" text-anchor="middle" font-size="11" fill="#555">hidden state</text><rect x="140" y="250" width="60" height="36" rx="8" fill="#fff7e0" stroke="#b9770e" stroke-width="1.5"/><text x="170.0" y="273.0" text-anchor="middle" font-size="14" fill="#1a1a1a">'h'</text><line x1="170" y1="250" x2="170" y2="202" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="130" y="70" width="80" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.5"/><text x="170.0" y="95.0" text-anchor="middle" font-size="14" fill="#1a1a1a">→ 'e'</text><line x1="170" y1="148" x2="170" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="220" y1="175" x2="298" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="150" width="100" height="50" rx="8" fill="#e8f0fe" stroke="#3b5b9d" stroke-width="1.5"/><text x="350.0" y="173.0" text-anchor="middle" font-size="14" fill="#1a1a1a">h_2</text><text x="350.0" y="192.0" text-anchor="middle" font-size="11" fill="#555">hidden state</text><rect x="320" y="250" width="60" height="36" rx="8" fill="#fff7e0" stroke="#b9770e" stroke-width="1.5"/><text x="350.0" y="273.0" text-anchor="middle" font-size="14" fill="#1a1a1a">'e'</text><line x1="350" y1="250" x2="350" y2="202" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="310" y="70" width="80" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.5"/><text x="350.0" y="95.0" text-anchor="middle" font-size="14" fill="#1a1a1a">→ 'l'</text><line x1="350" y1="148" x2="350" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="400" y1="175" x2="478" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="480" y="150" width="100" height="50" rx="8" fill="#e8f0fe" stroke="#3b5b9d" stroke-width="1.5"/><text x="530.0" y="173.0" text-anchor="middle" font-size="14" fill="#1a1a1a">h_3</text><text x="530.0" y="192.0" text-anchor="middle" font-size="11" fill="#555">hidden state</text><rect x="500" y="250" width="60" height="36" rx="8" fill="#fff7e0" stroke="#b9770e" stroke-width="1.5"/><text x="530.0" y="273.0" text-anchor="middle" font-size="14" fill="#1a1a1a">'l'</text><line x1="530" y1="250" x2="530" y2="202" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="490" y="70" width="80" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.5"/><text x="530.0" y="95.0" text-anchor="middle" font-size="14" fill="#1a1a1a">→ 'l'</text><line x1="530" y1="148" x2="530" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="580" y1="175" x2="658" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="660" y="150" width="100" height="50" rx="8" fill="#e8f0fe" stroke="#3b5b9d" stroke-width="1.5"/><text x="710.0" y="173.0" text-anchor="middle" font-size="14" fill="#1a1a1a">h_4</text><text x="710.0" y="192.0" text-anchor="middle" font-size="11" fill="#555">hidden state</text><rect x="680" y="250" width="60" height="36" rx="8" fill="#fff7e0" stroke="#b9770e" stroke-width="1.5"/><text x="710.0" y="273.0" text-anchor="middle" font-size="14" fill="#1a1a1a">'l'</text><line x1="710" y1="250" x2="710" y2="202" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="670" y="70" width="80" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.5"/><text x="710.0" y="95.0" text-anchor="middle" font-size="14" fill="#1a1a1a">→ 'o'</text><line x1="710" y1="148" x2="710" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="80" y1="175" x2="118" y2="175" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="62" y="180" text-anchor="middle" font-size="12" fill="#555" font-weight="normal">h_0 = 0</text><text x="530" y="320" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="normal">세 번째와 네 번째 입력은 둘 다 'l'. 입력만으로는 구분 불가</text><text x="530" y="340" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="normal">h_2 와 h_3 가 달라서 세 번째는 'l', 네 번째는 'o' 를 출력</text><rect x="470" y="240" width="300" height="56" rx="10" fill="none" stroke="#c0392b" stroke-dasharray="5,4"/>
</svg>
