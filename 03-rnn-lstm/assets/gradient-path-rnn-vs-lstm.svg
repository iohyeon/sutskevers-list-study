<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/></marker>
</defs>
<rect width="900" height="400" fill="#fbfbf8" stroke="#ddd"/>
<text x="450" y="28" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">한 시점을 거슬러 갈 때 기울기가 지나는 연산</text><text x="450" y="70" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">vanilla RNN</text><rect x="80" y="90" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#3b5b9d" stroke-width="1.5"/><text x="125.0" y="115.0" text-anchor="middle" font-size="14" fill="#1a1a1a">h_1</text><rect x="195" y="95" width="80" height="30" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="235.0" y="115.0" text-anchor="middle" font-size="11" fill="#1a1a1a">W_hh, tanh</text><line x1="170" y1="110" x2="193" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="275" y1="110" x2="298" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="90" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#3b5b9d" stroke-width="1.5"/><text x="345.0" y="115.0" text-anchor="middle" font-size="14" fill="#1a1a1a">h_2</text><rect x="415" y="95" width="80" height="30" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="455.0" y="115.0" text-anchor="middle" font-size="11" fill="#1a1a1a">W_hh, tanh</text><line x1="390" y1="110" x2="413" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="495" y1="110" x2="518" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="520" y="90" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#3b5b9d" stroke-width="1.5"/><text x="565.0" y="115.0" text-anchor="middle" font-size="14" fill="#1a1a1a">h_3</text><rect x="635" y="95" width="80" height="30" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="675.0" y="115.0" text-anchor="middle" font-size="11" fill="#1a1a1a">W_hh, tanh</text><line x1="610" y1="110" x2="633" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="715" y1="110" x2="738" y2="110" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="740" y="90" width="90" height="40" rx="8" fill="#e8f0fe" stroke="#3b5b9d" stroke-width="1.5"/><text x="785.0" y="115.0" text-anchor="middle" font-size="14" fill="#1a1a1a">h_4</text><text x="450" y="160" text-anchor="middle" font-size="13" fill="#c0392b" font-weight="normal">매 시점 행렬 곱과 tanh 를 통과. 기울기에 W_hhᵀ × diag(1 - h²) 가 시점 수만큼 곱해짐</text><text x="450" y="215" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">LSTM 의 cell state 경로</text><rect x="80" y="235" width="90" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.5"/><text x="125.0" y="260.0" text-anchor="middle" font-size="14" fill="#1a1a1a">C_1</text><circle cx="210" cy="255" r="13" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="210" y="260" text-anchor="middle" font-size="15" fill="#1e8449" font-weight="normal">×</text><circle cx="260" cy="255" r="13" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="260" y="260" text-anchor="middle" font-size="15" fill="#1e8449" font-weight="normal">+</text><line x1="170" y1="255" x2="195" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><line x1="223" y1="255" x2="245" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><line x1="273" y1="255" x2="298" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><text x="210" y="300" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="normal">f_2</text><line x1="210" y1="288" x2="210" y2="270" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/><text x="260" y="300" text-anchor="middle" font-size="11" fill="#b9770e" font-weight="normal">i ⊙ C̃</text><line x1="260" y1="288" x2="260" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="235" width="90" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.5"/><text x="345.0" y="260.0" text-anchor="middle" font-size="14" fill="#1a1a1a">C_2</text><circle cx="430" cy="255" r="13" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="430" y="260" text-anchor="middle" font-size="15" fill="#1e8449" font-weight="normal">×</text><circle cx="480" cy="255" r="13" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="480" y="260" text-anchor="middle" font-size="15" fill="#1e8449" font-weight="normal">+</text><line x1="390" y1="255" x2="415" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><line x1="443" y1="255" x2="465" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><line x1="493" y1="255" x2="518" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><text x="430" y="300" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="normal">f_3</text><line x1="430" y1="288" x2="430" y2="270" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/><text x="480" y="300" text-anchor="middle" font-size="11" fill="#b9770e" font-weight="normal">i ⊙ C̃</text><line x1="480" y1="288" x2="480" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="520" y="235" width="90" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.5"/><text x="565.0" y="260.0" text-anchor="middle" font-size="14" fill="#1a1a1a">C_3</text><circle cx="650" cy="255" r="13" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="650" y="260" text-anchor="middle" font-size="15" fill="#1e8449" font-weight="normal">×</text><circle cx="700" cy="255" r="13" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="700" y="260" text-anchor="middle" font-size="15" fill="#1e8449" font-weight="normal">+</text><line x1="610" y1="255" x2="635" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><line x1="663" y1="255" x2="685" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><line x1="713" y1="255" x2="738" y2="255" stroke="#1e8449" stroke-width="1.5" marker-end="url(#g)"/><text x="650" y="300" text-anchor="middle" font-size="12" fill="#c0392b" font-weight="normal">f_4</text><line x1="650" y1="288" x2="650" y2="270" stroke="#c0392b" stroke-width="1.5" marker-end="url(#r)"/><text x="700" y="300" text-anchor="middle" font-size="11" fill="#b9770e" font-weight="normal">i ⊙ C̃</text><line x1="700" y1="288" x2="700" y2="270" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="740" y="235" width="90" height="40" rx="8" fill="#e9f7ef" stroke="#1e8449" stroke-width="1.5"/><text x="785.0" y="260.0" text-anchor="middle" font-size="14" fill="#1a1a1a">C_4</text><text x="450" y="335" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="normal">직접 경로에서는 f_t (0 과 1 사이, 차원마다 다른 학습된 값) 만 곱해짐. f 가 1 에 가까운 차원은 기울기가 그대로 돌아옴</text><text x="450" y="380" text-anchor="middle" font-size="13" fill="#333" font-weight="normal">ResNet (ResNet 편):  y = x + F(x)  →  ∂y/∂x = 1 + ∂F/∂x   |   LSTM:  C_t = f_t ⊙ C_(t-1) + i_t ⊙ C̃_t  →  직접 경로의 계수는 f_t</text>
</svg>
