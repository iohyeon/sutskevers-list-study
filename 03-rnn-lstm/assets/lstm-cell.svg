<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="-apple-system, Helvetica, Arial, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e8449"/></marker>
</defs>
<rect width="900" height="490" fill="#fbfbf8" stroke="#ddd"/>
<text x="450" y="28" text-anchor="middle" font-size="15" fill="#1a1a1a" font-weight="bold">LSTM 셀 한 개 (시점 t). 위쪽 줄이 cell state, 아래쪽 줄이 hidden state</text><rect x="120" y="50" width="640" height="340" rx="16" fill="#ffffff" stroke="#999" stroke-width="1.5"/><line x1="40" y1="95" x2="245" y2="95" stroke="#1e8449" stroke-width="3" marker-end="url(#g)"/><line x1="275" y1="95" x2="465" y2="95" stroke="#1e8449" stroke-width="3" marker-end="url(#g)"/><line x1="495" y1="95" x2="850" y2="95" stroke="#1e8449" stroke-width="3" marker-end="url(#g)"/><text x="60" y="80" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">C_(t-1)</text><text x="820" y="80" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="bold">C_t</text><circle cx="260" cy="95" r="15" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="260" y="101" text-anchor="middle" font-size="18" fill="#1e8449" font-weight="bold">×</text><circle cx="480" cy="95" r="15" fill="#fff" stroke="#1e8449" stroke-width="2"/><text x="480" y="101" text-anchor="middle" font-size="18" fill="#1e8449" font-weight="bold">+</text><rect x="220" y="250" width="80" height="48" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="260.0" y="272.0" text-anchor="middle" font-size="16" fill="#1a1a1a">σ</text><text x="260.0" y="291.0" text-anchor="middle" font-size="11" fill="#555">forget f_t</text><rect x="340" y="250" width="80" height="48" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="272.0" text-anchor="middle" font-size="16" fill="#1a1a1a">σ</text><text x="380.0" y="291.0" text-anchor="middle" font-size="11" fill="#555">input i_t</text><rect x="440" y="250" width="80" height="48" rx="8" fill="#fff7e0" stroke="#b9770e" stroke-width="1.5"/><text x="480.0" y="272.0" text-anchor="middle" font-size="14" fill="#1a1a1a">tanh</text><text x="480.0" y="291.0" text-anchor="middle" font-size="11" fill="#555">후보 C̃_t</text><rect x="580" y="250" width="80" height="48" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="620.0" y="272.0" text-anchor="middle" font-size="16" fill="#1a1a1a">σ</text><text x="620.0" y="291.0" text-anchor="middle" font-size="11" fill="#555">output o_t</text><line x1="260" y1="250" x2="260" y2="112" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><circle cx="430" cy="180" r="15" fill="#fff" stroke="#b9770e" stroke-width="2"/><text x="430" y="186" text-anchor="middle" font-size="18" fill="#b9770e" font-weight="bold">×</text><path d="M380,250 L380,180 L413,180" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><path d="M480,250 L480,215 L445,190" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><path d="M430,165 L430,130 L468,104" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><rect x="665" y="140" width="60" height="34" rx="8" fill="#fff7e0" stroke="#b9770e" stroke-width="1.5"/><text x="695.0" y="162.0" text-anchor="middle" font-size="13" fill="#1a1a1a">tanh</text><path d="M695,95 L695,138" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><circle cx="695" cy="215" r="15" fill="#fff" stroke="#3b5b9d" stroke-width="2"/><text x="695" y="221" text-anchor="middle" font-size="18" fill="#3b5b9d" font-weight="bold">×</text><line x1="695" y1="174" x2="695" y2="198" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><path d="M620,250 L620,215 L678,215" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><path d="M695,230 L695,345 L850,345" fill="none" stroke="#3b5b9d" stroke-width="3" marker-end="url(#a)"/><text x="820" y="335" text-anchor="middle" font-size="13" fill="#3b5b9d" font-weight="bold">h_t</text><path d="M710,215 L780,215 L780,52" fill="none" stroke="#3b5b9d" stroke-width="1.5" marker-end="url(#a)"/><text x="800" y="45" text-anchor="middle" font-size="12" fill="#3b5b9d" font-weight="normal">y_t 로</text><path d="M40,345 L620,345" fill="none" stroke="#3b5b9d" stroke-width="3"/><text x="62" y="335" text-anchor="middle" font-size="13" fill="#3b5b9d" font-weight="bold">h_(t-1)</text><path d="M170,420 L170,345" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="170" y="438" text-anchor="middle" font-size="13" fill="#1a1a1a" font-weight="normal">x_t</text><text x="190" y="365" text-anchor="start" font-size="12" fill="#555" font-weight="normal">[h_(t-1), x_t] 를 이어 붙여 네 layer에 똑같이 넣는다</text><line x1="260" y1="345" x2="260" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="380" y1="345" x2="380" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="480" y1="345" x2="480" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><line x1="620" y1="345" x2="620" y2="300" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/><text x="450" y="470" text-anchor="middle" font-size="13" fill="#1e8449" font-weight="normal">초록 줄에는 행렬 곱과 비선형 함수가 없음. 원소별 곱(×) 한 번과 덧셈(+) 한 번만 통과</text>
</svg>
